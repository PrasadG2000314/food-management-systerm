services:
  # AgriBridge Web Application & Express REST API
  agribridge-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agribridge-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/agribridge
      - JWT_SECRET=agribridge_super_secure_jwt_secret_key_2026
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - agribridge-network

  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: agribridge-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - agribridge-network

  # Mongo Express - Web-based Database GUI Viewer
  mongo-express:
    image: mongo-express:latest
    container_name: agribridge-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongodb
    networks:
      - agribridge-network

volumes:
  mongodb_data:
    driver: local

networks:
  agribridge-network:
    driver: bridge
